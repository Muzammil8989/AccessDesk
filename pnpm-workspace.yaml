packages:
  - apps/*
  - packages/*

# pnpm 12 blocks dependency install scripts unless allowed here.
# Electron downloads its binary, Prisma fetches engines, esbuild its binary.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  esbuild: true
  prisma: true

# Pin patched versions of transitive dependencies that `pnpm audit` flags. Prisma's CLI pulls in
# mysql2 and deepmerge-ts (unused at runtime: we use PostgreSQL), tsup and vitest pull in esbuild.
# Remove an entry once the packages above it ship the fix themselves.
overrides:
  'mysql2@<3.23.1': '3.24.5'
  'deepmerge-ts@<8.0.0': '8.0.2'
  'esbuild@>=0.27.3 <0.28.1': '0.28.2'

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - typescript-eslint@8.71.1
  - pg-boss@12.37.0
  - '@radix-ui/react-label@2.1.16'
  - '@radix-ui/react-primitive@2.1.11'
  - '@radix-ui/react-slot@1.4.0'
  - vite@7.3.7
