title = "AccessDesk gitleaks config"

# Start from gitleaks' built-in rules (API keys, tokens, private keys, and so on).
[extend]
useDefault = true

# Things that look like secrets but are not.
[[allowlists]]
description = "Placeholder values and generated files"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)pnpm-lock\.yaml$''',
]
regexes = [
  '''change-me''',
]

[[allowlists]]
description = "Fake passwords used only by the onboarding unit tests. They protect nothing."
regexes = [
  '''Kd7mPq2xRt9WnH4v''',
  '''Pw-Secret-1234567''',
]
