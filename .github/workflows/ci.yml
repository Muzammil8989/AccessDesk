name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The event name keeps a late pull request run (whose ref becomes "main" once the pull request is
# merged) from cancelling the push run on main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The migration tests need a real PostgreSQL. They create their own scratch database.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The provider name may only appear where scripts/naming-allowlist.json allows (ADR 0009).
      - name: Naming check
        run: pnpm check:naming

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Runs every test and fails if coverage drops below the thresholds in each vitest.config.ts.
      - name: Test with coverage
        run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:change-me@localhost:5432/postgres

      - name: Build
        run: pnpm build

      - name: Keep coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Known vulnerabilities in dependencies. Kept separate so a newly published advisory
  # does not hide a real test failure, and so it can also run on a schedule.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level high
