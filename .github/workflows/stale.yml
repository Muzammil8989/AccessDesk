name: Close stale issues and pull requests

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 14 days unless someone
            comments. Comment if it is still relevant.
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be closed in 14 days unless
            there is new activity. Push a commit or comment to keep it open.
          close-issue-message: Closed because of no activity. Feel free to reopen it.
          close-pr-message: Closed because of no activity. Feel free to reopen it when you continue.
          exempt-issue-labels: security,pinned,help wanted,good first issue
          exempt-pr-labels: security,pinned
