name: Security gate

# Checks every pull request for leaked secrets and newly introduced vulnerable dependencies.
# If a check fails, "Security enforcement" (security-enforce.yml) closes pull requests from outside
# contributors. This workflow only reads. It never needs write access or secrets.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block files that must never be committed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '(^|/)\.env(\.[^/]*)?$|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$' \
            | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::This pull request adds files that normally hold secrets:"
            echo "$bad"
            exit 1
          fi

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Secrets are redacted in the log because the log of a public repository is public.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner
          --log-opts="$BASE_SHA..$HEAD_SHA" .

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Compares the lockfile before and after the pull request. Fails only when the pull request
      # adds a dependency with a known high or critical vulnerability. Older problems are caught by
      # "pnpm audit" in ci.yml.
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # Hands the outcome to security-enforce.yml. A pull request from a fork cannot be written to from
  # here, so a second workflow with write access reads this small result file (it never runs the
  # pull request's code).
  report:
    name: Record result
    if: always() && github.event_name == 'pull_request'
    needs: [secrets, dependency-review]
    runs-on: ubuntu-latest
    steps:
      - name: Write result file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          mkdir result
          printf '%s\n' "$PR_NUMBER" > result/pr-number
          printf 'secrets=%s\ndependencies=%s\n' "$SECRETS_RESULT" "$DEPENDENCIES_RESULT" > result/result.env

      - uses: actions/upload-artifact@v7
        with:
          name: security-gate-result
          path: result/
          retention-days: 3
